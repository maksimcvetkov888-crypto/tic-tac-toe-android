name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/*.apk output/tic-tac-toe.apk
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tic-tac-toe-apk
          path: output/tic-tac-toe.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: Release v1.2.0 - Magic UI & Anti-AI-Slop Craft Edition
          body: |
            ## ✨ Release v1.2.0: Magic UI & Anti-AI-Slop Craft Edition

            ### 🎨 Дизайн и компоненты (Anti-AI-Slop & Magic UI):
            - **Obsidian Zinc Architecture**: Глубокий тёмный фон (`#09090B`), отсутствие шаблонных фиолетовых градиентов и мыльных пилюль.
            - **Border Beam (Magic UI)**: 60fps кинетический световой луч, бегущий по периметру активной карточки хода и победных ячеек.
            - **Shimmer Button (Magic UI)**: Тактильная кнопка с зеркальным бликом отражения света и пружинной физикой нажатия.
            - **Bento Grid**: Асимметричная информационная сетка для отображения статистики игроков и серий побед.
            - **Tactile Cells (Creative Motion)**: Пружинное вдавливание ячеек при тапе (`scale: 0.94f`) и упругий овершут при появлении символов.
            - **Процедурный звук и вибрация**: Звуковые эффекты ходов и победы без утяжеления размера APK.

            ### 📥 Установка:
            1. Скачайте `tic-tac-toe.apk` ниже.
            2. Установите на ваше Android-устройство.
            3. Наслаждайтесь игрой с эстетикой ручной работы!
          files: output/tic-tac-toe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
