name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/*.apk output/tic-tac-toe.apk
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tic-tac-toe-apk
          path: output/tic-tac-toe.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Release v1.0.0 - Tic-Tac-Toe APK
          body: |
            ## 🎮 Крестики-Нолики для двух игроков (на одном устройстве)
            
            ### ✨ Особенности:
            - Режим 2 игроков на одном экране (Hot-Seat).
            - Современный стильный дизайн Material 3.
            - Счётчик побед и ничьих.
            - Виброотклик при ходах и победе.
            - Подсветка победной линии.
            
            ### 📥 Установка:
            1. Скачайте `tic-tac-toe.apk` ниже.
            2. Установите на ваше Android-устройство (разрешите установку из неизвестных источников при запросе).
            3. Приятной игры!
          files: output/tic-tac-toe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
