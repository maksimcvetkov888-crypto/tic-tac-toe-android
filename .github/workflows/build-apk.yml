name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Test and Build Release APK
        run: gradle testReleaseUnitTest assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/*.apk output/tic-tac-toe.apk
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tic-tac-toe-apk
          path: output/tic-tac-toe.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v5.0.2
          name: Release v5.0.2 - Zero Question Marks & Master Minimax AI
          body: |
            ## Релиз v5.0.2: Грандмастер 3D & Безупречный рендеринг

            ### 3D Игровой движок (Jetpack Compose Canvas):
            - Полноценная 3D геометрия: полигональные меши X и O с освещением по Ламберту и Z-сортировкой.
            - Интерактивная 3D орбитальная камера (вращение жестами пальца, двойной тап для сброса).
            - Тактильные 3D постаменты ячеек с физическим утапливанием по оси Z при нажатии.
            - Неоновые волны (Shockwaves) и парящий луч победы.
            - Magic UI: Border Beam, Shimmer Button, Bento Grid, моноширинная акцидентная типографика.
            - ИИ Грандмастер: алгоритм Minimax с Alpha-Beta отсечением, математически исключающий поражения.
            - 100% чистый рендеринг без знаков вопроса на любых версиях Android и в GitHub Release.

            ### Установка:
            1. Скачайте файл tic-tac-toe.apk ниже.
            2. Установите на ваше Android-устройство.
            3. Приятной игры!
          files: output/tic-tac-toe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
