name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/*.apk output/tic-tac-toe.apk
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tic-tac-toe-apk
          path: output/tic-tac-toe.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: Release v2.0.0 - Full 3D Kinetic Edition
          body: |
            ## 🕹️ Release v2.0.0: Full 3D Kinetic Edition

            ### 🔮 Настоящий 3D игровой движок (Jetpack Compose Canvas):
            - **Полноценная 3D геометрия**: Полигональные 3D меши крестиков и ноликов с расчётом нормалей граней, освещением по Ламберту (Lambertian Diffuse + Ambient) и Z-сортировкой (Painter's Algorithm).
            - **Интерактивное 3D вращение (Orbit Drag)**: Проводите пальцем по экрану, чтобы осматривать игровое поле с любого трёхмерного ракурса.
            - **3D тактильные постаменты**: Ячейки выполнены в виде объёмных 3D блоков с фасками. При нажатии ячейка физически утапливается по оси Z.
            - **3D парящий победный лазер**: Трёхмерный световой луч, парящий над выигрышной комбинацией.
            - **Magic UI & Anti-AI-Slop Craft**: Border Beam, Shimmer Button, Bento Grid, моноширинная акцидентная типографика и палитра Obsidian Zinc (`#09090B`).

            ### 📥 Установка:
            1. Скачайте `tic-tac-toe.apk` ниже.
            2. Установите на ваше Android-устройство.
            3. Приятной трёхмерной игры вдвоём на одном экране!
          files: output/tic-tac-toe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
