name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/*.apk output/tic-tac-toe.apk
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tic-tac-toe-apk
          path: output/tic-tac-toe.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: Release v1.1.0 - Jetpack Compose & Kotlin 2.0
          body: |
            ## 🚀 Release v1.1.0: Полный переход на Jetpack Compose и Kotlin 2.0

            ### 🌟 Новые возможности и архитектура:
            - **100% Jetpack Compose & Material 3**: Полный отказ от устаревших XML-разметок.
            - **MVI Clean Architecture**: Реактивное состояние экрана через `StateFlow` и однонаправленный поток данных (UDF).
            - **Edge-to-Edge**: Нативная поддержка полноэкранного режима под Android 15 (Target SDK 35).
            - **Праздничные эффекты (Confetti Canvas)**: Анимированный салют из частиц-конфетти при каждой победе.
            - **Пружинные анимации**: Плавное масштабирование символов X и O с физикой отскока (`spring damping`).
            - **Процедурный звук**: Встроенный генератор звуковых эффектов ходов, победы и сброса без утяжеления APK.
            - **Переключатели звука и виброотклика**: Возможность включать/выключать звук и тактильную отдачу прямо в шапке игры.

            ### 📥 Установка:
            1. Скачайте `tic-tac-toe.apk` ниже.
            2. Установите на ваше Android-устройство.
            3. Приятной игры вдвоём на одном экране!
          files: output/tic-tac-toe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
